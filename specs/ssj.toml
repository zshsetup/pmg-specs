#:schema https://raw.githubusercontent.com/zshsetup/pmg/main/schema.json

min_glibc = "2.30"
deps = ["openssh", "curl", "jq"]
bin = { ssj = "ssj" }
man = ["ssj.1"]
completions.ssj.zsh = "completions/_ssj"
completions.ssj.bash = "completions/ssj.bash"
completions.ssj.fish = "completions/ssj.fish"

test = "{{ cmd }} --version"

[external]
# none, as no package manager has it

[release]
type = "github"
repo = "zshsetup/ssj"

[download]
type = "github"

[assets]
glibc_x64 = "ssj-{{ version }}-x86_64-unknown-linux-gnu.tar.gz"
glibc_arm64 = "ssj-{{ version }}-aarch64-unknown-linux-gnu.tar.gz"
musl_x64 = "ssj-{{ version }}-x86_64-unknown-linux-musl.tar.gz"
musl_arm64 = "ssj-{{ version }}-aarch64-unknown-linux-musl.tar.gz"
macos_arm64 = "ssj-{{ version }}-aarch64-apple-darwin.tar.gz"
